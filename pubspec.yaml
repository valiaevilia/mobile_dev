name: mobile_dev_labs
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  sqflite: ^2.4.5
  path: ^1.9.1

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  json_annotation: ^4.12.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  copy_with_extension: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  json_serializable: ^6.14.1
  copy_with_extension_gen: ^18.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/launcher.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - image/
    - assets/
    - assets/icons/
